services:
  mysql:
    image: mysql:8.4
    container_name: ai-film-prod-local-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: liuguang_local
      MYSQL_DATABASE: ai_film_prod
      MYSQL_USER: ai_film
      MYSQL_PASSWORD: liuguang_local
    ports:
      - "3307:3306"
    volumes:
      - ai_film_prod_mysql:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci

volumes:
  ai_film_prod_mysql:
